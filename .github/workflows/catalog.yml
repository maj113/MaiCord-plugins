name: Publish the catalog

# Builds every plugin, theme and effect in this repository, renders the signed
# format-2 indexes MaiCord reads, verifies them against the public key compiled
# into MaiCord, and deploys the site to GitHub Pages:
#   https://maj113.github.io/MaiCord-plugins/index-4.json (+ .sig), for MaiCord on Linux: each effect's interface 4
#     package, the DXBC package plus a GLSL section (scripts/build_universal.py), and each plugin version's shared
#     object (scripts/build_linux_plugins.py)
#   https://maj113.github.io/MaiCord-plugins/index-3.json (+ .sig), for MaiCord 0.6.4 and later on Windows
#   https://maj113.github.io/MaiCord-plugins/index-full.json (+ .sig), for 0.6.3, and index.json (+ .sig), for
#     0.6.0 to 0.6.2: the same without what they can't read (scripts/publish_index.py)
#   https://maj113.github.io/MaiCord-plugins/details/<sha256>.md
#   https://maj113.github.io/MaiCord-plugins/previews/<sha256>.png
#   https://maj113.github.io/MaiCord-plugins/files/<sha256>.dll|.so|.json|.mcfx
# The build job needs no secret and runs on pull requests too: it compiles each
# plugin with MaiCord's pinned clang-cl against the SDK headers of MaiCord's
# repository, packs themes and effects (fxc, then previews and cost on WARP, the
# in-box software rasterizer) and checks the result. Only the sign job, on
# pushes to main, the weekly schedule and manual runs, holds the signing key.
# On pull requests it also writes a review report to the run's summary
# (scripts/review_report.py): the permissions and hosts each changed item
# declares against the published version, the DLL size, the effect cost class
# and the previews, which it uploads as an artifact. The Linux job then builds each
# plugin again as an x86-64 shared object (MaiCord's maicord-plugin tool on its pinned
# LLVM major, checked as the client's ELF loader checks it, its descriptor compared
# with the DLL's) and adds each effect's interface 4 package (MaiCord's maicord-plugin
# effect build --glsl, on its pinned DXC and SPIRV-Cross, cached by their pins),
# checked against the DXBC package; the sign job refuses an effect or plugin without
# one.
# Each index is valid for 30 days (the client accepts at most 35), so the weekly
# run re-signs it long before it expires. MaiCord's tools/release
# (plugin_index.py, each client's schema, and cng_p256.py, which signs
# with Windows CNG) come from MaiCord's master branch, hence the Windows runner.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('catalog-pr-{0}', github.event.pull_request.number) || 'catalog' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PAGES_URL: https://maj113.github.io/MaiCord-plugins

jobs:
  build:
    name: Build items
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Full history: a release's time and "did the source change" come from git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          fetch-depth: 0
          persist-credentials: false

      # The SDK headers every plugin builds against, the pinned LLVM toolchain
      # and the index schema. MAICORD_SDK_REF pins a branch, tag or commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maj113/MaiCord
          ref: ${{ vars.MAICORD_SDK_REF || 'master' }}
          path: maicord
          sparse-checkout: |
            /include/maicord/sdk/
            /include/maicord/sys/
            /src/render/effects/blue_noise_64.bin
            /tools/release/
            /tools/llvm_toolchain.json
            /tools/resolve_llvm_toolchain.ps1
            /tools/enter_build_environment.ps1
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the tools
        run: python -m pip install --disable-pip-version-check -r catalog/requirements.txt

      - name: Check the build tools
        run: python -B catalog/scripts/test_catalog_tools.py

      # One step: the developer shell (clang-cl, fxc, the Windows SDK libraries)
      # lives in this step's environment.
      - name: Build the plugins, themes and effects
        shell: powershell
        env:
          PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_PUBLIC_KEY }}
          NEXT_PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          . maicord/tools/enter_build_environment.ps1
          $keys = (@($env:PUBLIC_KEY, $env:NEXT_PUBLIC_KEY) | Where-Object { $_ }) -join ','
          $verify = if ($keys) { @('--public-key', $keys) } else { @() }
          python -B catalog/scripts/build_catalog.py --maicord maicord --out site --work build --previous $env:PAGES_URL @verify
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -B catalog/scripts/check_site.py --tools maicord/tools/release --source build/index-source.json site
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Pull requests only: what each changed item declares, set against the published catalog (permissions, network
      # hosts, DLL size, effect cost class, previews), as the run's summary. A summary needs no token and no secret,
      # so it works for pull requests from forks, which GitHub gives neither. Previews cannot be shown inside a
      # summary, so they go in an artifact under readable names. An aid, never a gate: a failure here fails nothing.
      - name: Write the review report
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_PUBLIC_KEY }}
          NEXT_PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_NEXT_PUBLIC_KEY }}
        run: |
          keys="$PUBLIC_KEY"
          if [ -n "$NEXT_PUBLIC_KEY" ]; then keys="${keys:+$keys,}$NEXT_PUBLIC_KEY"; fi
          verify=()
          if [ -n "$keys" ]; then verify=(--public-key "$keys"); fi
          python -B catalog/scripts/review_report.py --tools maicord/tools/release --source build/index-source.json \
            --site site --previous "$PAGES_URL" --base "$BASE" --report build/review-report.md --previews review-previews "${verify[@]}"

      - name: Upload the previews
        id: previews
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-previews
          path: review-previews
          if-no-files-found: ignore
          retention-days: 7

      - name: Show the review report
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        shell: bash
        env:
          PREVIEWS_URL: ${{ steps.previews.outputs.artifact-url }}
        run: |
          if [ -f build/review-report.md ]; then
            cat build/review-report.md >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$PREVIEWS_URL" ]; then
              printf '\nPreview images of the changed items (stills, and loops as PNG animations): [review-previews artifact](%s)\n' "$PREVIEWS_URL" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-build
          path: |
            site
            build/index-source.json
          if-no-files-found: error
          retention-days: 7

  universal:
    name: Linux packages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          fetch-depth: 0
          persist-credentials: false

      # The SDK headers the shaders include, the effect tool and the shader toolchain's pin and source.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maj113/MaiCord
          ref: ${{ vars.MAICORD_SDK_REF || 'master' }}
          path: maicord
          sparse-checkout: |
            /include/maicord/sdk/
            /include/maicord/sys/
            /tools/maicord-plugin/
            /tools/release/
            /tools/install_linux_toolchain.sh
            /tools/glsl_translate.py
            /tools/fetch_linux_shader_toolchain.py
            /tools/linux_shader_toolchain.json
            /tools/shadertool/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-build

      # DXC (a release tarball) and SPIRV-Cross (built from its pinned tag) with mc_shadertool: fetched by
      # tools/fetch_linux_shader_toolchain.py into this directory, named by the pins it holds.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/maicord-toolchain
          key: shader-toolchain-${{ runner.os }}-${{ hashFiles('maicord/tools/linux_shader_toolchain.json', 'maicord/tools/shadertool/mc_shadertool.cpp') }}

      # Every plugin built again for Linux with MaiCord's own tool on its pinned LLVM major (clang and ld.lld from
      # apt.llvm.org, installed by MaiCord's tools/install_linux_toolchain.sh, which holds the pin and prints the
      # resolved version), checked as the client's ELF loader checks it, and named as the "linux" file of the version.
      - name: Install the LLVM toolchain
        run: bash maicord/tools/install_linux_toolchain.sh

      - name: Build the plugins for Linux
        env:
          MAICORD_LLVM_BIN: /usr/lib/llvm-23/bin
        run: |
          python -B catalog/scripts/build_linux_plugins.py --maicord maicord --source build/index-source.json \
            --summary build/linux-summary.md site
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -f build/linux-summary.md ]; then
            cat build/linux-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Make the Linux packages
        run: |
          python -B catalog/scripts/build_universal.py --maicord maicord --source build/index-source.json site
          python -B catalog/scripts/check_site.py --tools maicord/tools/release --source build/index-source.json --require-universal site

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-universal
          path: |
            site
            build/index-source.json
          if-no-files-found: error
          retention-days: 7

  sign:
    name: Render and sign
    needs: [build, universal]
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    environment: catalog
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: catalog
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maj113/MaiCord
          ref: ${{ vars.MAICORD_SDK_REF || 'master' }}
          path: maicord
          sparse-checkout: /tools/release/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: catalog-universal

      - name: Render and sign
        shell: powershell
        env:
          MAICORD_PLUGIN_CATALOG_SIGNING_KEY: ${{ secrets.MAICORD_PLUGIN_CATALOG_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          python -B catalog/scripts/publish_index.py --tools maicord/tools/release build/index-source.json site
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The key MaiCord builds compile in (MAICORD_PLUGIN_CATALOG_PUBLIC_KEY).
      - name: Verify
        shell: powershell
        env:
          PUBLIC_KEY: ${{ vars.MAICORD_PLUGIN_CATALOG_PUBLIC_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:PUBLIC_KEY) { throw 'Set the MAICORD_PLUGIN_CATALOG_PUBLIC_KEY repository variable.' }
          python -B catalog/scripts/check_site.py --tools maicord/tools/release --public-key $env:PUBLIC_KEY --require-universal site
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to Pages
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # GitHub disables scheduled workflows in a public repository after 60 days
  # without a commit, which would let the index expire. A scheduled run lands
  # an empty commit once main is 45 days old (pushes by this token start no
  # workflow).
  keepalive:
    name: Keep the schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Commit when main is idle
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -lt $((45 * 86400)) ]; then echo "main is $((age / 86400)) days old."; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --allow-empty -m 'Keep the scheduled catalog refresh enabled'
          git push origin HEAD:main
